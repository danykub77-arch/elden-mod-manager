[package]
name = "elden-mod-manager"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "elden_mod_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

reqwest = {
    version = "0.12",
    default-features = false,
    features = [
        "rustls-tls",
        "json"
    ]
}

flate2 = "1.1.10"
tar = "0.4.46"
zip = "8.6.0"

# Native archive support for real Nexus downloads.
#
# unrar-rs is a Rust implementation for reading/extracting RAR archives.
# We only use extraction functionality.
unrar-rs = {
    version = "0.10.3",
    default-features = false,
    features = ["crypto-rust"]
}

# Pure Rust 7Z decompression.
sevenz-rust = "0.6.1"


er-save-lib = { path = "vendor/er-save-lib" }

deku = "0.17"
md5 = "0.7"
tauri-plugin-deep-link = "2"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2.4.4", features = ["deep-link"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
